spring.application.name=web-service

## Use environment variables when provided, otherwise fall back to an in-memory H2 DB for local runs
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
## Let Hibernate auto-detect the dialect from the JDBC metadata (safer for H2 fallback)
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

logging.level.com.empuje.web_service=DEBUG

# Nivel global de logs (advertencias m�nimas de Spring)
logging.level.root=WARN

# Muestra logs con formato m�s limpio
spring.output.ansi.enabled=ALWAYS

